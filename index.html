<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
    header, footer { background: #0f766e; color: #fff; padding: 20px; text-align: center; }
    header img { max-height: 60px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 20px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .card img { width: 100%; height: 180px; object-fit: contain; }
    button { background: #0f766e; color: #fff; border: 0; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; }
    .form { max-width: 400px; margin: 20px auto; display: none; }
    .form input, .form textarea { width: 100%; margin: 6px 0; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <header>
    <img id="logo" src="" alt="">
    <h1 id="company-name"></h1>
    <p id="company-desc"></p>
  </header>

  <main>
    <div class="grid" id="products"></div>

    <div class="form" id="checkout-form">
      <h3>Your details</h3>
      <input id="c-name" placeholder="Full name" required>
      <input id="c-email" type="email" placeholder="Email" required>
      <input id="c-phone" placeholder="Phone" required>
      <textarea id="c-address" placeholder="Delivery address" required></textarea>
      <button id="pay-btn">Pay now</button>
    </div>
  </main>

  <footer>
    <div id="contact"></div>
  </footer>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
